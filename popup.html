<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="extName">Vexto Connect</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="head">
      <img class="brand-icon" src="icons/icon48.png" alt="" width="30" height="30" />
      <div class="brand">
        <strong>Vexto Connect</strong>
        <span id="version">v—</span>
      </div>
      <button id="open-options-icon" class="icon-btn" type="button"
              data-i18n-attr="title:openOptions,aria-label:openOptions">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.6.66 1 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"></path>
        </svg>
      </button>
    </header>

    <section class="status-card" aria-live="polite">
      <div class="status-line">
        <span class="dot checking" id="dot" aria-hidden="true"></span>
        <strong id="state-label">Checking…</strong>
        <span class="state-version" id="state-version"></span>
      </div>
      <p class="reason" id="reason"></p>
      <dl class="meta">
        <div><dt data-i18n="labelEngine">Engine</dt><dd id="engine">—</dd></div>
        <div><dt data-i18n="labelProtocol">Protocol</dt><dd id="protocol">—</dd></div>
        <div><dt data-i18n="labelEndpoint">Endpoint</dt><dd id="endpoint">—</dd></div>
        <div><dt data-i18n="labelChecked">Checked</dt><dd id="checked">—</dd></div>
      </dl>
    </section>

    <section class="rows">
      <div class="row">
        <span class="row-label" data-i18n="rowExtension">Extension</span>
        <strong class="row-value" id="enabled-state">—</strong>
      </div>
      <label class="row">
        <span class="row-label" data-i18n="navAuto">Auto takeover</span>
        <span class="switch">
          <input type="checkbox" id="auto-takeover" />
          <span class="track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <footer class="actions">
      <button id="refresh" class="btn" type="button" data-i18n="refreshStatus">Refresh status</button>
      <button id="open-options" class="btn primary" type="button" data-i18n="openOptions">Open settings</button>
    </footer>
  </main>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
