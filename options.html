<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vexto Connect 选项</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="card">
    <header class="head">
      <div>
        <h1>Vexto Connect</h1>
        <p class="sub">把浏览器里的下载交给本机 Vexto</p>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">启用</span>
      </label>
    </header>

    <section class="section">
      <h2>连接</h2>
      <label class="row">
        <span class="label">主机</span>
        <input id="host" type="text" spellcheck="false" placeholder="127.0.0.1" />
      </label>
      <label class="row">
        <span class="label">API 端口</span>
        <input id="port" type="number" min="1024" max="65535" placeholder="29110" />
      </label>
      <label class="row">
        <span class="label">API 密钥</span>
        <input id="secret" type="password" autocomplete="off" placeholder="可选；与 Vexto 设置保持一致" />
      </label>
      <p class="hint">密钥为空时不校验；只设置单边会返回 401。扩展只访问本机回环地址。</p>
    </section>

    <section class="section">
      <h2>使用</h2>
      <p class="hint">当前版本：右键链接 →「用 Vexto 下载」。自动接管浏览器下载在后续版本加入。</p>
      <p class="hint">Vexto 需要先在托盘运行；扩展不能自行启动 Vexto。</p>
    </section>

    <div class="actions">
      <button id="save" class="btn primary" type="button">保存</button>
      <button id="test" class="btn" type="button">测试连接</button>
      <span id="status" class="status" role="status"></span>
    </div>

    <pre id="detail" class="detail hidden"></pre>
  </main>
  <script src="options.js"></script>
</body>
</html>
